<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ana Silva — Senior product designer</title>
<meta name="description" content="Portafolio de Ana Silva, senior product designer especializada en accesibilidad y design systems.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Source+Serif+4:opsz,wght@8..60,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header" id="site-header">
  <div class="lang" role="group" aria-label="Idioma / Language">
    <button type="button" class="lang__btn" data-lang="en" aria-pressed="false">en</button>
    <button type="button" class="lang__btn" data-lang="es" aria-pressed="true">es</button>
  </div>
</header>

<section class="hero" id="hero">
  <canvas class="hero__smoke" id="smoke" aria-hidden="true"></canvas>

  <div class="hero__content">
    <p class="hero__name">Ana Silva</p>
    <h1 class="hero__title" id="title"></h1>
    <ul class="hero__tags js-tags"></ul>
  </div>
</section>

<main class="page">
  <div class="page__grid">
    <aside class="side">
      <!-- TODO: reproductor de música. Pendiente de implementar; hoy es solo el contenedor. -->
      <section class="player" id="music-player" data-i18n-label="player">
        <div class="mp3">
          <div class="mp3__body">
            <canvas class="mp3__glitter" aria-hidden="true"></canvas>
            <div class="mp3__panel">
              <div class="mp3__screen">
                <svg class="mp3__state mp3__state--pause" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1h2v8H2zM6 1h2v8H6z"/></svg>
                <svg class="mp3__state mp3__state--play" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>
                <span class="mp3__battery" aria-hidden="true"></span>
                <div class="mp3__info">
                  <p class="mp3__song" data-i18n="playerUi.song"></p>
                  <p class="mp3__artist" data-i18n="playerUi.artist"></p>
                </div>
              </div>
              <p class="mp3__brand" aria-hidden="true">Digital MP3 Player</p>
            </div>
            <div class="mp3__wheel">
              <button type="button" class="mp3__btn mp3__btn--up" data-action="volume-up" data-i18n-label="playerUi.volUp">+</button>
              <button type="button" class="mp3__btn mp3__btn--prev" data-action="prev" data-i18n-label="playerUi.prev">
                <svg viewBox="0 0 14 8" aria-hidden="true"><path d="M1 0v8M7 0v8L1.5 4zM13 0v8L7.5 4z"/></svg>
              </button>
              <button type="button" class="mp3__btn mp3__btn--next" data-action="next" data-i18n-label="playerUi.next">
                <svg viewBox="0 0 14 8" aria-hidden="true"><path d="M13 0v8M7 0v8l5.5-4zM1 0v8l5.5-4z"/></svg>
              </button>
              <button type="button" class="mp3__btn mp3__btn--down" data-action="volume-down" data-i18n-label="playerUi.volDown">&minus;</button>
              <button type="button" class="mp3__center" data-action="toggle" data-i18n-label="playerUi.toggle"></button>
            </div>
          </div>
        </div>
      </section>

      <section class="card about" id="about">
        <h2 class="deco-title about__title" aria-label="About me">** ~* sOoBRee_Mii *~ ** &lt;3</h2>
        <h3 data-i18n="about.styleTitle"></h3>
        <p data-i18n="about.style"></p>
        <h3 data-i18n="about.expTitle"></h3>
        <p data-i18n="about.exp1"></p>
        <p data-i18n="about.exp2"></p>
        <h3 data-i18n="about.lifeTitle"></h3>
        <p data-i18n="about.life"></p>
      </section>
    </aside>

    <section class="panel" id="proyectos" data-i18n-label="projectsLabel">
      <h2 class="deco-title" data-i18n-label="projectsLabel">&dagger;&laquo;---&middot;[ xX_MiiZz_PrOyecToSz_Xx ]&middot;---&raquo;&dagger;</h2>
      <div id="projects"></div>
    </section>
  </div>

  <footer class="contact" id="contacto">
    <p class="contact__lead" data-i18n="contact.lead"></p>
    <p data-i18n="contact.body"></p>
    <p class="contact__links">
      <a href="mailto:ana.silvab93@gmail.com"><span data-i18n="contact.email"></span> → ana.silvab93@gmail.com</a>
      <a href="https://linkedin.com/in/anasilvabenitez93" target="_blank" rel="noopener">LinkedIn → linkedin.com/in/anasilvabenitez93</a>
    </p>
  </footer>
</main>

<script src="js/glitter-smoke.js"></script>
<script src="js/glitter.js"></script>
<script src="js/weight-title.js"></script>
<script src="js/main.js"></script>
</body>
</html>
