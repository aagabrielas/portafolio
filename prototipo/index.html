<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo humo glitter</title>
<style>
  html,body{margin:0;height:100%;background:#141414;overflow:hidden;font:12px/1.3 system-ui,sans-serif;color:#ddd}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #panel{position:fixed;left:12px;bottom:12px;width:230px;padding:10px 12px;background:rgba(10,10,14,.78);
    border:1px solid #ffffff22;border-radius:10px;backdrop-filter:blur(6px)}
  #panel h1{font-size:12px;margin:0 0 6px;font-weight:600;letter-spacing:.04em}
  #panel label{display:grid;grid-template-columns:1fr 48px;gap:2px 8px;margin:5px 0}
  #panel input{grid-column:1/-1;width:100%;accent-color:#9b7bff}
  #panel output{text-align:right;color:#b9a2ff}
  #panel button{margin-top:6px;width:100%;padding:5px;border:1px solid #ffffff33;border-radius:6px;background:#ffffff10;color:#eee;cursor:pointer}
  #panel small{display:block;margin-top:6px;opacity:.55}
</style>
</head>
<body>
<canvas id="smoke"></canvas>
<div id="panel">
  <h1>Humo · ajustes</h1>
  <div id="sliders"></div>
  <button id="copy">Copiar valores</button>
  <small>H = ocultar panel</small>
</div>
<script src="../js/smoke/glitter-smoke.js"></script>
<script>
  const smoke = new GlitterSmoke(document.getElementById('smoke'));
  const defs = [
    ['softness',       'Suavidad del borde', 0, 8, .1],
    ['splatRadius',    'Grosor del trazo',   .0003, .006, .0001],
    ['dyeAmount',      'Densidad',           .2, 1.5, .05],
    ['force',          'Empuje',             500, 6000, 100],
    ['curl',           'Remolinos',          0, 40, 1],
    ['dyeDissipation', 'Difusión',           .1, 3, .05],
    ['dyeFade',        'Se apaga en',        0, .8, .01],
    ['velDissipation', 'Duración del flujo', 0, 2, .05],
    ['maxSpeed',       'Velocidad máx.',     10, 200, 5],
    ['edgeGlow',       'Halo del borde',     0, 1, .01],
    ['grayDim',        'Brillo del gris',    0, 1, .01],
    ['grayBase',       'Claridad del fondo', 0, 1, .01],
    ['grayMotion',     'Movimiento del gris', 0, 1, .01],
  ];
  const box = document.getElementById('sliders');
  for (const [k, name, min, max, step] of defs) {
    const l = document.createElement('label');
    l.innerHTML = `<span>${name}</span><output></output><input type="range" min="${min}" max="${max}" step="${step}">`;
    const i = l.querySelector('input'), o = l.querySelector('output');
    i.value = smoke.cfg[k]; o.textContent = i.value;
    i.oninput = () => { smoke.cfg[k] = +i.value; o.textContent = i.value; };
    box.append(l);
  }
  document.getElementById('copy').onclick = e => {
    const out = {}; for (const [k] of defs) out[k] = smoke.cfg[k];
    navigator.clipboard?.writeText(JSON.stringify(out, null, 2));
    e.target.textContent = '¡Copiado!'; setTimeout(() => e.target.textContent = 'Copiar valores', 1200);
  };
  addEventListener('keydown', e => { if (e.key.toLowerCase() === 'h') { const p = document.getElementById('panel'); p.hidden = !p.hidden; } });
</script>
</body>
</html>
